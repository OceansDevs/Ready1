<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #228B22; /* Green background */
            color: white;
        }
        .navbar {
            background-color: #FFA500 !important; /* Orange navbar */
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .nav-link:hover {
            color: #228B22 !important; /* Green on hover */
        }
        .btn-primary {
            background-color: #FFA500;
            border-color: #FFA500;
        }
        .btn-primary:hover {
            background-color: white;
            color: #FFA500;
            border-color: white;
        }
        .btn-outline-secondary {
            border-color: white;
            color: white;
        }
        .btn-outline-secondary:hover {
            background-color: #FFA500;
            color: white;
        }
        .dropdown-menu {
            background-color: #FFA500;
        }
        .dropdown-item {
            color: white;
        }
        .dropdown-item:hover {
            background-color: white;
            color: #FFA500;
        }
        main {
            margin-top: 80px; /* Added space between navbar and heading */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">AksHospitals</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a class="nav-link active text-success" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'signin' %}">Sign In</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  More
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                  <li><a class="dropdown-item" href="">Contact Us</a></li>
                  <li><a class="dropdown-item" href="#">Media</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    <main>
        <div class="px-4 py-5 my-5 text-center">
          <h1 class="display-5 fw-bold">Simplifying taxes, one payment at a time!</h1>
          <div class="col-lg-6 mx-auto">
            <p class="lead mb-4">Managing taxes shouldn’t be complicated—Akirsibom Tax makes it effortless!</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
              <a href="{% url 'signup' %}" class="btn btn-primary btn-lg px-4 gap-3">Get Started</a>
              <a href="#" class="btn btn-outline-secondary btn-lg px-4 gap-3">Learn More</a>

            </div>
          </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
